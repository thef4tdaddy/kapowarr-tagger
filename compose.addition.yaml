# Add this service under services: in the existing Kapowarr stack.
services:
  kapowarr-tagger:
    image: ghcr.io/thef4tdaddy/kapowarr-tagger:preview
    container_name: kapowarr-tagger
    user: "1029:100"
    cpu_shares: 50
    mem_limit: 256m
    environment:
      TZ: Etc/UTC
      KAPOWARR_URL: http://kapowarr:5656
      KAPOWARR_API_KEY_FILE: /run/secrets/kapowarr_api_key
      COMICS_ROOT: /comics
      STATE_DIR: /state
      MODE: preview
      POLL_SECONDS: "300"
      SETTLE_SECONDS: "300"
      KAVITA_URL: http://kavita:5000
      KAVITA_API_KEY_FILE: /run/secrets/kavita_api_key
      KAVITA_COMICS_ROOT: /comics # Must match the path INSIDE Kavita
      WEBHOOK_TOKEN_FILE: /run/secrets/webhook_token
      WEBHOOK_PORT: "8080"
      # Optional comma-separated Kapowarr volume IDs, not Comic Vine IDs.
      VOLUME_IDS: ""
    volumes:
      - /path/to/comics:/comics
      - /path/to/config/kapowarr-tagger/state:/state
      - /path/to/config/kapowarr-tagger/secrets/kapowarr_api_key:/run/secrets/kapowarr_api_key:ro
      - /path/to/config/kapowarr-tagger/secrets/kavita_api_key:/run/secrets/kavita_api_key:ro
      - /path/to/config/kapowarr-tagger/secrets/webhook_token:/run/secrets/webhook_token:ro
    stop_grace_period: 15m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [kapowarr]
    restart: unless-stopped
